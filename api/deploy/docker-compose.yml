# Stack da API da My Box na VPS compartilhada. Publicada pelo Caddy do servidor (rede "edge",
# site em /opt/edge/sites/mybox-api.caddy). Nao abre porta na internet.
#   cd /opt/mybox-api/deploy && docker compose up -d --build
name: mybox-api
services:
  api:
    build: ..
    container_name: mybox-api
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /app/data/mybox.db
      STORAGE_DIR: /app/data/files
      TRUST_PROXY: "true"
    ports:
      # So para debug local na VPS (curl 127.0.0.1:3020); o publico entra pelo Caddy.
      - "127.0.0.1:3020:3000"
    volumes:
      - mybox-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [edge]

volumes:
  mybox-data:

networks:
  edge:
    external: true
