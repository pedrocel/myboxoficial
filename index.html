<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/mybox.PNG" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Box | Academia com conceito de shopping</title>
    <meta name="description" content="A My Box é uma academia com conceito de shopping, transformando o tempo dedicado à atividade física em uma experiência prazerosa." />

    <!-- Tema do painel: aplica antes da primeira pintura para nao piscar escuro. -->
    <script>
      (function () {
        try {
          var p = location.pathname;
          var painel = p === '/entrar' || p === '/painel' || p.indexOf('/painel/') === 0;
          var claro = painel && localStorage.getItem('mybox-theme') === 'light';
          document.documentElement.classList.add(claro ? 'light' : 'dark');
          document.documentElement.style.colorScheme = claro ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : '';
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, 'script', 'dataLayer', 'GTM-K6XT5NT4');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist:wght@100..900&display=swap" rel="stylesheet" />
    <script>
      // Aplica o tema antes do React montar, para nao piscar escuro no carregamento.
      try {
        var escuro = localStorage.getItem('mybox-theme') === 'dark'
        document.documentElement.classList.add(escuro ? 'dark' : 'light')
      } catch (e) {
        document.documentElement.classList.add('light')
      }
    </script>
  </head>

    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-K6XT5NT4"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
